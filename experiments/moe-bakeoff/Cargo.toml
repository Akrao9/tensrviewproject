[package]
name = "moe-inspector"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
webgl = ["rune/webgl"]

[dependencies]
rune = { path = "../../../rune/crates/rune", features = ["tooling"] }
rune-kit = { path = "../../../rune/crates/rune-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[patch.crates-io]
wgpu-hal = { path = "../../../rune/vendor/wgpu-hal" }
winit = { path = "../../../rune/vendor/winit" }
parley_engine = { path = "../../../rune/vendor/parley_engine" }
accesskit_windows = { path = "../../../rune/vendor/accesskit_windows" }
