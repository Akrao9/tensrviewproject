<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TensorQuill · MoE inspector</title>
  <style>html, body { margin: 0; width: 100%; height: 100%; }</style>
</head>
<body>
  <script type="module">
    import init from './moe_inspector.js';

    const probe = new URLSearchParams(location.search).get('backend') === 'webgl2';
    if (probe) {
      Object.defineProperty(navigator, 'gpu', { value: undefined });
      globalThis.RUNE_CPU_FIRST = 'off';
    }
    const getContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type, ...args) {
      const context = getContext.call(this, type, ...args);
      if (context && (type === 'webgpu' || type === 'webgl2')) {
        document.body.dataset.graphicsContext = type;
      }
      return context;
    };

    try {
      await init();
      document.body.dataset.wasm = 'loaded';
    } catch (error) {
      document.body.dataset.wasm = 'failed';
      document.body.append(String(error));
      throw error;
    }
  </script>
</body>
</html>
