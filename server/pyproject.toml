# The Python packaging of the `tensorquill-server` binary: maturin puts the compiled program in
# the wheel as a script, so `pip install tensorquill-server` leaves it in the environment's
# scripts directory. There is no Python module. The crate in Cargo.toml is the source of the
# version: `dynamic = ["version"]` makes maturin read `[package] version` there, so the number is
# written once. The fallback wheel for platforms without a build is made from a built wheel by
# packaging/fallback_wheel.py and so carries the same metadata.
[build-system]
# 1.9.3 is the first maturin with PEP 639 `license` and `license-files` working in full.
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "tensorquill-server"
dynamic = ["version"]
description = "Self-hosted ingest server and offline detectors for TensorQuill: Arrow Flight DoPut in, partitioned Parquet out."
readme = "README.md"
# The wheel holds no Python. The floor is only there so it is never tighter than the SDK's (3.10).
requires-python = ">=3.8"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["pytorch", "observability", "arrow-flight", "parquet", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
# No authors or urls: the project owner chooses them at first publish, as in sdk/pyproject.toml.

[tool.maturin]
bindings = "bin"
strip = true
