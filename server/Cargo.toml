[package]
name = "tensorquill-server"
version = "0.0.1"
edition = "2021"
description = "Self-hosted ingest server for TensorQuill: Arrow Flight DoPut in, partitioned Parquet out."
license = "Apache-2.0 OR MIT"
keywords = ["pytorch", "observability", "arrow-flight", "parquet", "training"]
categories = ["development-tools::profiling", "network-programming"]
# No `repository` or `homepage` yet: the project owner chooses the URLs at first publish. The
# README is named in pyproject.toml, which is what builds the wheels for PyPI; this crate is not
# published to crates.io. Licenses are listed so `cargo package` ships them.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
arrow = "60.1.0"
arrow-flight = "60.1.0"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
# The store ID's 128 random bits (L3). Already in every build through Arrow's `ahash`.
getrandom = "0.3"
object_store = "0.14.2"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "async", "zstd"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read from a JSON column is the nearest double to its text, as Python
# reads it. The default parser can be one unit in the last place off, and the detectors must
# judge, and report, the value that was recorded.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
url = "2"

[features]
# Cloud stores are on by default: the server's job is to write to S3, GCS or local disk. A build
# for local disk only (`--no-default-features`) leaves out the HTTP client and the cloud
# authentication code; `--store s3://...` then says the build has no S3 support.
default = ["s3", "gcs"]
s3 = ["object_store/aws"]
gcs = ["object_store/gcp"]

[dev-dependencies]
tempfile = "3"
