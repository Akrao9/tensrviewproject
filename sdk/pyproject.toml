[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorquill"
version = "0.0.1"
description = "See inside a PyTorch training run: cheap per-layer capture that survives torch.compile."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["pytorch", "training", "observability", "debugging", "mixture-of-experts", "torch-compile", "profiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# `tensorquill-server` is the Rust server as a wheel: it puts the `tensorquill-server` binary beside
# the interpreter, where `server_detect.find_binary` looks. No platform marker: a platform without
# a binary wheel gets the near-empty one, and the Python detectors do the work there. The range
# is the 0.0 series, which reports the protocol number this package checks (`server_detect.PROTOCOL`).
dependencies = ["torch>=2.6", "tensorquill-server>=0.0.1,<0.1"]

[project.optional-dependencies]
dev = ["pytest"]
rerun = ["numpy", "rerun-sdk==0.43.2"]
lightning = ["lightning>=2.4"]
huggingface = ["transformers>=4.46", "accelerate>=1.0"]
flight = ["pyarrow>=17"]
# NVML readings for `init(..., system=True)`: temperature, clocks, power, ECC, throttling, Xid.
nvml = ["nvidia-ml-py"]

[project.scripts]
tensorquill = "tensorquill.evidence:main"
# The read-only MCP server (stdio): `uvx --from tensorquill tensorquill-mcp PATH`.
tensorquill-mcp = "tensorquill.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
