[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorlens"
version = "0.0.1"
description = "See inside a PyTorch training run: cheap per-layer capture that survives torch.compile."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest"]
rerun = ["numpy", "rerun-sdk==0.43.2"]

[project.scripts]
tensorlens = "tensorlens.evidence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
