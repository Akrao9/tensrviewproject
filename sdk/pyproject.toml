[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorquill"
version = "0.0.1"
description = "See inside a PyTorch training run: cheap per-layer capture that survives torch.compile."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["pytorch", "training", "observability", "debugging", "mixture-of-experts", "torch-compile", "profiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest"]
rerun = ["numpy", "rerun-sdk==0.43.2"]
lightning = ["lightning>=2.4"]
huggingface = ["transformers>=4.46", "accelerate>=1.0"]
flight = ["pyarrow>=17"]

[project.scripts]
tensorquill = "tensorquill.evidence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
