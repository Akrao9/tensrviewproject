name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run the GPU check (needs a self-hosted runner with the labels below)
        type: boolean
        default: false
      gpu_runner:
        description: Runner labels for the GPU check, as a JSON list
        default: '["self-hosted", "gpu"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk

jobs:
  cpu:
    name: CPU, Python ${{ matrix.python }}, PyTorch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        torch: ["2.6", "2.10", "2.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - name: Install
        run: |
          pip install "torch==${{ matrix.torch }}.*" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python -c "import torch; print(torch.__version__)"
      - name: Tests
        run: pytest -ra
      - name: Compiler gate script, CPU fallback
        # Without CUDA this runs on aot_eager: it checks graph breaks, recompiles, router
        # counts and the detector, but not Inductor or CUDA graphs. The gpu job does those.
        run: python examples/gpu_check.py --skip-overhead

  extras:
    # Lightning, Transformers and Rerun are optional, so their tests are skipped in the matrix above.
    name: CPU with Lightning, Hugging Face and Rerun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - name: Install
        run: |
          pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,lightning,huggingface,rerun,flight,nvml]"
      - name: Tests
        run: pytest -ra
      - name: Gate 1 fixtures through the SDK pipeline
        run: pytest -ra ../experiments/moe-bakeoff/test_fixtures.py ../experiments/gate1/test_gate1.py
      - name: Trainer callback acceptance script, toy model
        run: python examples/trainer_check.py --toy --backend aot_eager --steps 150 --seed-step 100 --probe-every 50 --out "$RUNNER_TEMP/trainer-check"
      - name: Seeded gradient-spike and stalled-weight cases, toy model
        run: python examples/seeded_failures.py --toy --case both --out "$RUNNER_TEMP/seeded-failures"
      - name: Seeded gradient spike in one small parameter (x100, the total does not move), toy model
        run: python examples/seeded_failures.py --toy --case grad_spike --factor 100 --out "$RUNNER_TEMP/seeded-x100"

  server:
    name: Ingest server and end-to-end streaming
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - name: Server tests
        run: cargo test --manifest-path ../server/Cargo.toml
      - name: Local-only build (no S3 or GCS) still lints and passes
        run: |
          cargo clippy --manifest-path ../server/Cargo.toml --all-targets --no-default-features -- -D warnings
          cargo test --manifest-path ../server/Cargo.toml --no-default-features --lib
      - name: Install
        run: |
          pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,flight]"
          pip install 'moto[server]' boto3  # the S3 emulator for test_object_store_e2e.py
      - name: Sender and end-to-end tests
        env:
          TENSORQUILL_SERVER_BIN: ${{ github.workspace }}/server/target/debug/tensorquill-server
        run: |
          test -x "$TENSORQUILL_SERVER_BIN"
          pytest -ra tests/test_flight.py tests/test_flight_e2e.py tests/test_two_ranks_e2e.py tests/test_server_detectors.py tests/test_server_detect.py tests/test_golden.py tests/test_server_reports.py tests/test_watch_all_ranks.py tests/test_object_store_e2e.py tests/test_data_server.py tests/test_attention.py tests/test_run_state.py tests/test_incident_classes.py tests/test_mcp_server.py tests/test_trigger.py

  package:
    # New and never run on Linux: it may need a fix on its first run, so it does not fail the workflow yet.
    name: Build, twine check, clean-venv smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/dist" .
          twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Check the archive contents
        run: python packaging/check_archives.py "$RUNNER_TEMP/dist"
      - name: Wheel in a clean venv, no outbound network
        env:
          TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: bash packaging/smoke.sh "$RUNNER_TEMP"/dist/*.whl examples/toy_moe.py

  crate:
    # Dry run only: nothing is uploaded, and no registry token is in this job's environment.
    # New and never run on Linux, so it does not fail the workflow yet.
    name: Package the server crate
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: cargo package --list
      - run: cargo publish --dry-run

  gpu:
    # GitHub's free runners have no GPU, so this runs only when started by hand, on a
    # self-hosted runner that already has a CUDA build of PyTorch. It is never started
    # by a pull request, so outside code cannot reach the runner.
    name: GPU compiler gate
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: ${{ fromJSON(inputs.gpu_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'this runner has no CUDA'; print(torch.__version__)"
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -ra
      - name: Compiler gate, Inductor with CUDA graphs
        env:
          TORCH_LOGS: graph_breaks,recompiles,cudagraphs
        run: python examples/gpu_check.py --skip-overhead
