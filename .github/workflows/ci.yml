name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: Also run the GPU check (needs a self-hosted runner with the labels below)
        type: boolean
        default: false
      gpu_runner:
        description: Runner labels for the GPU check, as a JSON list
        default: '["self-hosted", "gpu"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk

# The actions below are at the major versions that run on Node 24 (checkout v7, setup-python v7; in
# server-wheels.yml also upload-artifact v7 and download-artifact v8), set on Nov 27, 2026. The versions before
# ran on Node 20, which GitHub has retired: each job carried a warning and was forced onto Node 24. Node 24 is
# the newest runtime an action can declare on that date, so no later Node can be chosen here. A self-hosted
# runner (the GPU job) needs runner version 2.327.1 or later for them.
jobs:
  cpu:
    name: CPU, Python ${{ matrix.python }}, PyTorch ${{ matrix.torch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        torch: ["2.6", "2.10", "2.14", "2.15"]
        # The newest PyTorch on the newer Pythons it ships wheels for (2.15 has them for 3.11 to 3.15).
        include:
          - python: "3.13"
            torch: "2.15"
          - python: "3.14"
            torch: "2.15"
          # The declared floor on both axes (`requires-python = ">=3.10"`, `torch>=2.6`).
          - python: "3.10"
            torch: "2.6"
          # PyTorch 2.9: capture.py (`_NotRecomputed`) names it as no longer saving for backward an input
          # that backward does not use, the router hook's buffer in a checkpointed block among them,
          # where 2.6 saves it. 2.7 and 2.8 have not been checked.
          - python: "3.12"
            torch: "2.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - name: Install
        run: |
          pip install "torch==${{ matrix.torch }}.*" --index-url https://download.pytorch.org/whl/cpu
          # Python 3.10 has no tomllib: packaging/requirements.py then reads pyproject.toml with tomli.
          python -c "import tomllib" 2>/dev/null || pip install tomli
          # tensorquill-server is not on PyPI before the first release, so pip cannot resolve it yet:
          # everything else tensorquill requires, then tensorquill alone (packaging/requirements.py).
          python packaging/requirements.py dev > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
          python -c "import torch; print(torch.__version__)"
      - name: Tests
        run: pytest -ra
      - name: Compiler gate script, CPU fallback
        # Without CUDA this runs on aot_eager: it checks graph breaks, recompiles, router
        # counts and the detector, but not Inductor or CUDA graphs. The gpu job does those.
        run: python examples/gpu_check.py --skip-overhead

  extras:
    # Lightning, Transformers and Rerun are optional, so their tests are skipped in the matrix above.
    name: CPU with Lightning, Hugging Face and Rerun
    runs-on: ubuntu-latest
    # 60, not 30: on a2e652d the suite passed here in 27 minutes 52 seconds (4,531 tests) and the job was cancelled
    # at 30 minutes in the next step; the plain job on Python 3.11 with PyTorch 2.6 hit the same limit once on 981fe6c.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - name: Install
        run: |
          pip install "torch==2.15.*" --index-url https://download.pytorch.org/whl/cpu
          # tensorquill-server is not on PyPI before the first release, so pip cannot resolve it yet:
          # everything else tensorquill requires, then tensorquill alone (packaging/requirements.py).
          python packaging/requirements.py dev lightning huggingface rerun flight nvml > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
          # peft, for tests/test_peft_lora.py only, so not an extra of the package. Its requirements are lower bounds
          # (torch>=1.13, accelerate>=0.21, transformers with none) that the lines above already meet, and pip leaves a
          # met requirement as it is: torch, transformers and accelerate do not move. The next line shows them.
          pip install "peft==0.22.0"
          python -c "import torch, transformers, accelerate, peft; print(torch.__version__, transformers.__version__, accelerate.__version__, peft.__version__)"
      - name: Tests
        run: pytest -ra
      - name: Gate 1 fixtures through the SDK pipeline
        run: pytest -ra ../experiments/moe-bakeoff/test_fixtures.py ../experiments/gate1/test_gate1.py
      - name: TrainCheck's silent errors against TensorQuill, the catalog and one short run
        run: pytest -ra ../experiments/traincheck-bugs/test_traincheck_bugs.py
      - name: Trainer callback acceptance script, toy model
        run: python examples/trainer_check.py --toy --backend aot_eager --steps 150 --seed-step 100 --probe-every 50 --out "$RUNNER_TEMP/trainer-check"
      - name: Seeded gradient-spike and stalled-weight cases, toy model
        run: python examples/seeded_failures.py --toy --case both --out "$RUNNER_TEMP/seeded-failures"
      - name: Seeded gradient spike in one small parameter (x100, the total does not move), toy model
        run: python examples/seeded_failures.py --toy --case grad_spike --factor 100 --out "$RUNNER_TEMP/seeded-x100"

  server:
    name: Ingest server and end-to-end streaming
    runs-on: ubuntu-latest
    # The whole SDK suite runs here (below), after the cargo steps (about 10 minutes). On 2fba021 the suite, by then
    # 5,978 tests, was at 87% after 37 minutes when the 50-minute limit ended the job: steady progress, no hang.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/pyproject.toml
      - name: Server tests
        run: cargo test --manifest-path ../server/Cargo.toml
      - name: Lint the default build, with the S3 and GCS stores
        run: cargo clippy --manifest-path ../server/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Local-only build (no S3 or GCS) still lints and passes
        run: |
          cargo clippy --manifest-path ../server/Cargo.toml --all-targets --no-default-features -- -D warnings
          cargo test --manifest-path ../server/Cargo.toml --no-default-features --lib
      - name: Install
        run: |
          pip install "torch==2.15.*" --index-url https://download.pytorch.org/whl/cpu
          # tensorquill-server is not on PyPI before the first release, so pip cannot resolve it yet:
          # everything else tensorquill requires, then tensorquill alone (packaging/requirements.py).
          python packaging/requirements.py dev flight > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
          pip install 'moto[server]' boto3  # the S3 emulator for test_object_store_e2e.py
      - name: Sender and end-to-end tests
        # The whole suite, with the binary: a list of files left out every server-dependent test file
        # added after it (lanes V7, W2 and W3: XC10), and the CPU jobs skip those tests without the
        # binary. A test skipped here for want of the binary, or of pyarrow to hand it records, fails the job.
        env:
          TENSORQUILL_SERVER_BIN: ${{ github.workspace }}/server/target/debug/tensorquill-server
        run: |
          set -o pipefail
          test -x "$TENSORQUILL_SERVER_BIN"
          pytest -ra 2>&1 | tee "$RUNNER_TEMP/server-pytest.log"
          if grep -E '^SKIPPED.*(tensorquill-server|TENSORQUILL_SERVER_BIN|server binary|pyarrow)' "$RUNNER_TEMP/server-pytest.log"; then
            echo "::error::the tests above were skipped for want of the server binary or pyarrow, which this job provides"
            exit 1
          fi

  package:
    name: Build, twine check, clean-venv smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/dist" .
          twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Check the archive contents
        run: python packaging/check_archives.py "$RUNNER_TEMP/dist"
      - name: Wheel in a clean venv, no outbound network
        env:
          TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: bash packaging/smoke.sh "$RUNNER_TEMP"/dist/*.whl examples/toy_moe.py

  gpu:
    # GitHub's free runners have no GPU, so this runs only when started by hand, on a
    # self-hosted runner that already has a CUDA build of PyTorch. It is never started
    # by a pull request, so outside code cannot reach the runner.
    name: GPU compiler gate
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: ${{ fromJSON(inputs.gpu_runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          python -c "import torch; assert torch.cuda.is_available(), 'this runner has no CUDA'; print(torch.__version__)"
          # tensorquill-server is not on PyPI before the first release, so pip cannot resolve it yet:
          # everything else tensorquill requires, then tensorquill alone (packaging/requirements.py).
          python packaging/requirements.py dev > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
      - name: Tests
        run: pytest -ra
      - name: Compiler gate, Inductor with CUDA graphs
        env:
          TORCH_LOGS: graph_breaks,recompiles,cudagraphs
        run: python examples/gpu_check.py --skip-overhead
